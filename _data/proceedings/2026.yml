  - title: |-
      Mapping the space of harmonic cadences between Brazilian choro, jazz and Anglophone popular music
    authors: |-
      Mauro Orsini Windholz and Fabian C. Moss
    url: https://doi.org/10.1145/3815723.3815724
    abstract: |-
      Corpus studies on musical harmony have increased musicology’s knowledge of the harmonic behavior of different styles based on large datasets. However, such studies rarely compare corpora of different styles in a direct manner. Moreover, such studies typically focus on styles from the Global North, raising concerns about the limited diversity of the music and identities they represent. This paper reports on an experiment that addresses these issues by extending a methodology to analyze and compare harmonic progressions at moments of formal segmentation in different styles based on corpora of Roman numeral annotations. The method is applied to the styles of Brazilian choro, Anglophone popular and jazz music. The results indicate that, at formal boundaries, jazz exhibits unique and widespread use of 7th chords and applied 2–5–1 patterns in comparison to the other two styles. The results for choro suggest that the style exhibits a unique closing harmonic pattern: iv–iiø–i and higher incidence of applied dominants, which are, however, not always nested within applied 2–5–1 patterns, as in the case of jazz. Popular music exhibited unique and widespread use of perfect triads, blues and flat-side progressions. Common tonal harmonic motions such as IV–V7–I were found to be less typical of jazz than the other two styles, a result that contrasted with a previous study, which indicated that such motions are present to a similar degree in choro, popular and Western classical music. This suggests that jazz harmonic language may be more distant from tonal motions that are considered prototypical in music theory than the other three styles. By drawing on data-driven methods and large corpora, this study enables a more robust characterization of the harmonic behavior of these styles and how they compare to each other, increasing our knowledge of the development of triadic harmony in different parts of the world.
  - title: |-
      The CollabScore Dataset - Towards Robust and Generalized OMR Evaluation
    authors: |-
      Philippe Rigaux, Bertrand Couasnon, Christophe Guillotel-Nothmann, Fabien Guilloux and Aurélie Lemaitre
    url: https://doi.org/10.1145/3815723.3815725
    abstract: |-
      We present in this paper the CollabScore dataset, initially built to test and validate a new Optical Music Recognition (OMR) system. This dataset includes 184 pages of scores from an homogeneous corpus which consists of various works from a single composer, Camille Saint-Saëns (1835-1921). In addition to the essential data, namely images and reference scores encoded in MEI, we describe an original approach to content referencing based on the IIIF standard, and we discuss some general principles to conduct OMR evaluation in the proposed framework, including the tuning of comparison metrics.
  - title: |-
      Multimodal Large Language Model-Assisted Metadata Extraction from Historical Concert Programmes (1872–1928)
    authors: |-
      Sebastian Oliver Eck and Kevin R. Page
    url: https://doi.org/10.1145/3815723.3815726
    abstract: |-
      Historical concert programmes are widely recognised as valuable sources for musicological historiography; yet, although many collections are increasingly becoming available online, identifying relevant programmes within larger archival holdings remains difficult. When present, descriptive metadata is often provided only at the collection level rather than for individual items. Even then, the absence of granular metadata at the level of individual programmes continues to preclude systematic analysis of their contents at scale. This paper reports the results of an experiment, testing whether general-purpose multimodal large language models (MLLMs) can assist in preparing semi-structured concert programme metadata as a first-pass metadata record ready for subsequent expert verification and reconciliation. Using a sample of 100 programmes (1872–1928) from three Oxford student music societies held at the Bodleian Libraries, we implement a lightweight workflow comprising low-cost image capture using everyday consumer hardware, minimal preprocessing, schema-constrained JSON output, and repeated sampling using a simple consensus strategy of extracted metadata fields. We compare MLLM outputs against a manually curated reference dataset using Levenshtein distance as a character-level error measure, treating extraction correctness primarily in terms of sufficient intelligibility and data consistency for future reconciliation. We find that MLLM output quality depends strongly on model choice and on expert-controlled design decisions (including hierarchical JSON schema definition and prompt specification). We conclude with practical recommendations for institutions and researchers who wish to treat MLLMs as assistive components in ephemera metadata creation workflows, while retaining expert authority over final metadata records.
  - title: |-
      Facilitating Access to LinkedMusic with SESEMMI: Converting Natural Language Queries to SPARQL with Large Language Models
    authors: |-
      Liam Pond, Sichen Meng, Linnea Kirby, Sebastien Chow, Simon Ngassam, Dylan Hillerbrand and Ichiro Fujinaga
    url: https://doi.org/10.1145/3815723.3815727
    abstract: |-
      Currently, there are over one hundred online music metadata databases, and answering even simple questions often requires querying many of them separately. This fragmentation makes large-scale, cross-cultural, or longitudinal research difficult and time-consuming. In this paper, we present LinkedMusic, an initiative that aims to solve this problem by combining these databases into a unified data store. The ingested data are stored in RDF format and can be queried using SPARQL, a query language for RDF. However, SPARQL's complexity makes it prohibitively difficult for many users. To address this limitation, we investigate the capacity of Large Language Models (LLMs) to translate Natural Language Queries (NLQ) into SPARQL, enabling retrieval across multiple integrated databases. This effort, the Search Engine System for Enhancing Music Metadata Interoperability (SESEMMI), aims to facilitate access to LinkedMusic through a natural language interface. We conducted, to the best of our knowledge, the first study of LLM-based NLQ-to-SPARQL translation on a music metadata knowledge graph. We evaluated five models on twenty music-domain NLQ-to-SPARQL pairs and found that Claude Sonnet 4 achieved the highest accuracy, reaching 100% on single-database queries in both zero- and one-shot contexts and 47% on complex zero-shot cross-database queries.
  - title: |-
      ‘Building’ or ‘Bullshit’? AI-assisted Making and the EUYO Concert Explorer
    authors: |-
      Chanda VanderHart, David M. Weigl and Werner Goebl
    url: https://doi.org/10.1145/3815723.3815728
    abstract: |-
      We interrogate the impact of AI-assisted prototyping tools on scholarly ‘building’ in digital musicology, asking how they reconfigure agency, labour, and epistemic responsibility. Focusing on Figma Make, a Large Language Model (LLM)-driven tool that enables rapid generation of interactive systems from prompts, we present the EUYO Concert Explorer as a central case study. This digital library application–built by a musicologist without coding expertise–visualises fifty years of concert and membership data from the European Union Youth Orchestra. The project demonstrates that AI-assisted making lowers the technical barrier for music-domain experts, allowing them to externalise knowledge quickly into high-fidelity prototypes that serve as ‘boundary objects’ for interdisciplinary communication. However, the ease and polish of AI-generated prototypes come with methodological trade-offs. While accelerating early-stage design, they obscure foundational work required for scholarly rigor. LLMs, understood in the philosophical sense as ‘bullshit machines’, generate plausible but unverified outputs, offering a veneer of completeness that masks errors, omissions, and unfounded assumptions. Our experience with ‘vibe coding’ for digital musicology suggests not a wholesale redistribution of labour, but a shift in early-stage agency and an urgency for critical validation and verification. Stages of rapid prototyping preceded extensive work in data governance, geospatial correction, and analytical validation–all in face of the LLM’s spurious claims of completion and accuracy. Through a practice-based account of system development over 200 versions, we conclude that AI-assisted tools reshape, but do not resolve, core tensions in digital scholarship.
  - title: |-
      Encoding polymeter: A corpus of Hugo Distler’s «Der Jahrkreis» op. 5 in different symbolic formats
    authors: |-
      Lucas Hofmann, Craig S. Sapp and Fabian C. Moss
    url: https://doi.org/10.1145/3815723.3815729
    abstract: |-
      We present DistlerCorpus, a corpus of Hugo Distler’s Der Jahrkreis op. 5 (1933), a collection of 52 predominantly three-voice motets. The corpus is provided in Humdrum and MEI formats. The creation of the data set addresses Distler’s distinctive notational treatment of polymeter: voice-specific time signatures and the resulting non-aligned barlines, combined with frequent homometric meter changes. These characteristics expose limitations in current symbolic music encoding formats (MusicXML, MuseScoreXML, MEI, Humdrum) and motivate our proposed recommendations for encoding polymetric notation in digital music corpora.
  - title: |-
      A Rāga Independent Encoder for Svara Representation in Carnatic Music
    authors: |-
      Vivek Vijayan, Thomas Nuttall and Xavier Serra
    url: https://doi.org/10.1145/3815723.3815730
    abstract: |-
      Learning effective representations for svaras (notes) in Carnatic Music is a challenging task, primarily due to the limited availability of annotated data. In this work, we propose a data-efficient representation learning framework that leverages large amounts of unannotated audio of Carnatic music performances through self-supervised learning. We pretrain a rāga-independent svara encoder using contrastive learning on pitch contours augmented to mimic natural variations in human svara renditions. We evaluate the learned representations by fine-tuning the pretrained model on the Carnatic Varnam dataset for rāga-specific svara classification and rāga-independent clustering. The proposed framework significantly improves performance for both tasks compared to models trained from scratch solely on annotated data. Our encoder is made available as part of an existing tools repository for the computational analysis of Carnatic music and is expected to be valuable for downstream tasks such as Carnatic music analysis and svara transcription.
  - title: |-
      Boundary Characteristics of Sancara Segments in Carnatic Music
    authors: |-
      Thomas Nuttall, Brindha Manickavasakan, Xavier Serra and Lara Pearson
    url: https://doi.org/10.1145/3815723.3815731
    abstract: |-
      Melodic phrases, known as sañcāras, act as the building blocks of Carnatic music, playing an important structural and expressive role in the style. However, efforts to automatically identify the borders of sañcāras tend to be imperfect, failing, for example, to reliably approximate human annotations of segmentation points. In this paper, we add to an existing dataset of Carnatic performances with a set of 3,149 expert annotated sañcāras across 3 performers and 7 rāgas, and through a series of statistical analyses, investigate which aspects of Carnatic music performance distinguish phrase boundaries from other regions. We consider a mix of dynamic, timbral, and chroma-based features, as well as distance to other performance events such as silence and stasis. Our analyses demonstrate that these features exhibit significant differences at sañcāra onsets/offsets when compared with other points in the performance and we further show how this relationship can be exploited to inform automated phrase segmentation tasks.
  - title: |-
      Beyond Rules: Towards Basso Continuo Personal Style Identification
    authors: |-
      Adam Štefunko
    url: https://doi.org/10.1145/3815723.3815732
    abstract: |-
      A central part of the contemporary Historically Informed Practice movement is basso continuo, an improvised accompaniment genre with its traditions originating in the baroque era and actively practiced by many keyboard players nowadays. Although computational musicology has studied the theoretical foundations of basso continuo expressed by harmonic and voice-leading rules and constraints, characteristics of basso continuo as an active performing art have been largely overlooked mostly due to a lack of suitable performance data that could be empirically analyzed. This has changed with the introduction of The Aligned Continuo Realization Dataset (ACoRD) and the basso continuo realization-to-score alignment. Basso continuo playing is shaped by stylistic traditions coming from historical treatises, but it also may provide space for showcasing individual performance styles of its practitioners. In this paper, we attempt to explore the question of the presence of personal styles in the basso continuo realizations of players in the ACoRD dataset. We use a historically informed structured representation of basso continuo performance pitch content called griffs and Support Vector Machines to see whether it is possible to classify players based on their performances. The results show that we can identify players from their performances. In addition to the player classification problem, we discuss the elements that make up the individual styles of the players.
  - title: |-
      A model for an interactive digital critical edition of 19th-century Italian opera
    authors: |-
      Francesco Maccarini, Candida Billie Mantica, Giovanni Meriani and Mark Saccomano
    url: https://doi.org/10.1145/3815723.3815733
    abstract: |-
      The theatrical system of 19th-century Italian opera required that singers, impresarios, or the authors themselves modify or adapt the text of an opera for the necessities of a specific performance. Extant autograph manuscripts typically bear the traces of such transformations, mirroring a succession of performing events. The aim of a 19th-century Italian opera critical edition is thus not to offer a definitive text corresponding to an ideal, unique authorial intention, but to establish with the highest possible accuracy textual data corresponding to different, equally legitimate, versions. The implications of textual fluidity have, however, only been partially realized in practice, as the printed volume medium is static by its very nature. Alongside traditional print formats, digital editions have been developed that support non-linear navigation and interactive textual comparison. However, most of them still replicate the logic of printed volumes in their presentation of variants. Using Bellini’s Adelson e Salvini as a case study, this paper proposes a model of digital critical edition addressed to both scholars and performers. It seeks to overcome the limitations of printed volumes by presenting a truly interactive musical text, one that enables users to browse and compare alternative materials, make informed editorial and performative choices, and construct personalized editions by integrating alternative variants.
  - title: |-
      From Field to Archive: A Preservation-Centered Workflow for Multimodal Music Collections
    authors: |-
      Xiner Chen, Juan Sierra, Rebecca Pittam, Brad Bauer and Carlos Guedes
    url: https://doi.org/10.1145/3815723.3815734
    abstract: |-
      Recent advances in field recording technologies have enabled unprecedented spatial, sonic, and visual capture of traditional music. However, the lasting value of these audiovisual materials depends on both fidelity and the robustness of archival preservation. This paper presents a preservation-centered workflow bridging multimodal music field recording and sustainable digital archiving. Building on prior recording methodologies [14] and current practices from the Music and Sound Cultures (MaSC) research group at New York University Abu Dhabi (NYUAD), the study examines an Archival-Ready Submission Workflow that prepares audiovisual materials for long-term preservation, including the recompilation of technical and ethnographic metadata and the systematic generation and organization of master files and rendered derivatives. This methodology aims to facilitate collaborations with institutional partners such as libraries, and to create digital music collections that support both long-term archival preservation and research corpora development for Music Information Retrieval (MIR) and other multidisciplinary music analysis.
  - title: |-
      A Timed Petri Net Model and Renderer for Typesetting Pre-Mensural Polyphony
    authors: |-
      Joshua Stutter
    url: https://doi.org/10.1145/3815723.3815735
    abstract: |-
      The automated rendering of visual music notation from symbolic encodings is a core component of many Music Information Retrieval and digital musicology workflows. While rendering methodologies for Common Western Music Notation and fully mensural medieval polyphony are now well established, no comparable approach exists for pre-mensural polyphony, where note durations are not securely defined and horizontal layout is governed primarily by points of synchronisation between voices. This paper presents a new layout methodology and SVG renderer designed specifically for pre-mensural polyphony, using Timed Petri Nets to model notational elements, their sequential relationships, and moments of vertical alignment. Rather than imposing an abstract temporal grid or assigning artificial durations, the proposed approach treats layout as an optimisation problem over local spacing constraints, ensuring synchronisation while minimising editorial intervention. The methodology is implemented as a batch renderer that converts MEI encodings–using the in-development MEI-notredame customisation–into SVG files, and is exposed through a web interface to support interactive editorial workflows. By decoupling layout from duration, this work demonstrates a viable computational model for rendering polyphonic neumatic notation in a form that more closely reflects its manuscript sources.
  - title: |-
      Bridging Piano Pedagogy and Digital Music Libraries
    authors: |-
      Hyae-jin Hwang and Synae Yoon
    url: https://doi.org/10.1145/3815723.3815736
    abstract: |-
      Selecting appropriate piano repertoire requires extensive listening, score study, and pedagogical experience to evaluate musical, technical, and physical demands. However, such judgments are rarely documented in structured form within digital music libraries, where metadata typically emphasizes bibliographic description rather than teaching-oriented context. This paper presents a custom AI-assisted system that generates structured natural-language descriptions of piano repertoire informed by listening and score study. Rather than assigning fixed difficulty levels or generating automated recommendations, the system reflects how teachers describe pedagogical challenges to support instructional decision-making. Through illustrative case studies, we show how these descriptions support practical understanding of repertoire and help bridge pedagogical practice and digital music library records.
